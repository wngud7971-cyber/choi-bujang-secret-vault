<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 가상 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth { margin: 24px 0; padding: 22px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 22px; }
    .auth p { margin: 10px 0; font-size: 15px; }
    form { display: grid; gap: 10px; }
    label { font-weight: 600; }
    input, textarea, button { box-sizing: border-box; width: 100%; border-radius: 8px; padding: 12px; font: inherit; }
    input, textarea { border: 1px solid #71869c; color: #ecf4ff; background: #101a28; }
    textarea { min-height: 130px; resize: vertical; }
    li span { white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-actions { display: flex; gap: 10px; margin-top: 12px; }
    .note-actions button { width: auto; }
    .secondary { color: #ecf4ff; background: #35485e; }
    #note-message { min-height: 1.7em; }
    button { margin-top: 6px; border: 0; background: #8ad8df; color: #101a28; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #ecf4ff; outline-offset: 3px; }
    #auth-message { min-height: 1.7em; overflow-wrap: anywhere; }
    #auth-message[data-error="true"] { color: #ffe3e8; }
    #signed-in-email { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인을 붙입니다</div>
    <h1>가상 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다. 메모는 서버를 통해 불러옵니다.</p>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">자료실 로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required maxlength="254" disabled>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required disabled>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p><span id="signed-in-email"></span> 계정으로 로그인했습니다.</p>
        <button id="logout-button" type="button" disabled>로그아웃</button>
      </div>
      <p id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <div class="notice">가상 자료만 입력해 주세요. 목록에는 본인 메모가 표시됩니다. 다른 계정의 메모 주소를 아는 사람의 접근을 막는 기능은 4단계에서 추가합니다.</div>
    <section id="note-editor" class="auth" aria-labelledby="note-heading" hidden>
      <h2 id="note-heading">가상 메모 추가</h2>
      <form id="note-form">
        <label for="note-title">제목</label>
        <input id="note-title" name="title" required maxlength="160">
        <label for="note-body">내용</label>
        <textarea id="note-body" name="body" required maxlength="10000"></textarea>
        <button id="note-save" type="submit">메모 추가</button>
        <button id="note-cancel" class="secondary" type="button" hidden>수정 취소</button>
      </form>
      <p id="note-message" role="status" aria-live="polite"></p>
    </section>
    <h2>내 가상 메모</h2>
    <ul id="notes" aria-live="polite"><li>로그인하면 가상 자료를 볼 수 있습니다.</li></ul>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script type="module" id="auth-script">
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const signedIn = document.querySelector('#signed-in');
    const signedInEmail = document.querySelector('#signed-in-email');
    const status = document.querySelector('#auth-status');
    const message = document.querySelector('#auth-message');
    const list = document.querySelector('#notes');
    const editor = document.querySelector('#note-editor');
    const noteForm = document.querySelector('#note-form');
    const noteHeading = document.querySelector('#note-heading');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteCancel = document.querySelector('#note-cancel');
    const noteMessage = document.querySelector('#note-message');
    let client;
    let ready = false;
    let busy = false;
    let activeToken = null;
    let notesRequest = 0;
    let notesAbort;
    let editId = null;
    let noteBusy = false;
    let operationAbort;

    function resetEditor() {
      editId = null;
      noteTitle.value = '';
      noteBody.value = '';
      noteHeading.textContent = '가상 메모 추가';
      noteSave.textContent = '메모 추가';
      noteCancel.hidden = true;
    }

    function setNoteBusy(value) {
      noteBusy = value;
      noteForm.setAttribute('aria-busy', String(value));
      for (const control of [noteTitle, noteBody, noteSave, noteCancel]) control.disabled = value;
    }

    async function noteRequest(path, method, token, body, signal) {
      const headers = { Authorization: `Bearer ${token}` };
      if (body) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method, headers, body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store', redirect: 'error', signal,
      });
      if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 로그아웃 후 다시 로그인해 주세요.');
      if (response.status === 404) throw new Error('메모가 없습니다. 목록을 새로 불러와 주세요.');
      if (response.status === 400) throw new Error('제목과 내용을 확인해 주세요.');
      if (response.status === 409) throw new Error('같은 ID의 메모가 이미 있습니다.');
      if (!response.ok) throw new Error('자료실 요청을 처리하지 못했습니다. 서버 연결과 DB 권한을 확인해 주세요.');
      return response.json();
    }

    async function refreshNotes() {
      if (!activeToken) return;
      notesAbort?.abort();
      await loadNotes(activeToken, ++notesRequest);
    }

    async function noteOperation(action, body) {
      if (!ready || !activeToken || noteBusy) return;
      const token = activeToken;
      const controller = new AbortController();
      operationAbort = controller;
      setNoteBusy(true);
      noteMessage.textContent = '처리 중입니다.';
      try {
        const result = await action(token, controller.signal, body);
        if (activeToken !== token || controller.signal.aborted) return;
        if (result?.editing) {
          editId = result.note.id;
          noteTitle.value = result.note.title;
          noteBody.value = result.note.body;
          noteHeading.textContent = '가상 메모 수정';
          noteSave.textContent = '수정 저장';
          noteCancel.hidden = false;
          noteTitle.focus();
          noteMessage.textContent = '내용을 바꾸고 수정 저장을 눌러 주세요.';
        } else {
          resetEditor();
          noteMessage.textContent = result.message;
          await refreshNotes();
        }
      } catch (error) {
        if (activeToken !== token || controller.signal.aborted) return;
        noteMessage.textContent = error instanceof TypeError
          ? '자료 서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.' : error.message;
      } finally {
        if (operationAbort === controller) setNoteBusy(false);
      }
    }

    noteForm.addEventListener('submit', event => {
      event.preventDefault();
      if (!noteTitle.value.trim() || !noteBody.value.trim()) {
        noteMessage.textContent = '제목과 내용을 입력해 주세요.';
        return;
      }
      const id = editId;
      void noteOperation(async (token, signal, body) => {
        await noteRequest(id ? `/api/notes/${encodeURIComponent(id)}` : '/api/notes',
          id ? 'PUT' : 'POST', token, body, signal);
        return { message: id ? '메모를 수정했습니다.' : '메모를 추가했습니다.' };
      }, { title: noteTitle.value, body: noteBody.value });
    });
    noteCancel.addEventListener('click', () => {
      if (noteBusy) return;
      resetEditor();
      noteMessage.textContent = '수정을 취소했습니다.';
    });

    function showNotesMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    async function loadNotes(token, requestId) {
      showNotesMessage('가상 자료를 불러오는 중입니다.');
      const controller = new AbortController();
      notesAbort = controller;
      try {
        const data = await noteRequest('/api/notes', 'GET', token, undefined, controller.signal);
        if (!Array.isArray(data) || data.some(note => !note
            || typeof note.id !== 'string' || typeof note.title !== 'string'
            || typeof note.body !== 'string')) throw new Error('자료 형식이 맞지 않습니다.');
        // A response started before logout or an account change must not restore old notes.
        if (requestId !== notesRequest) return;
        if (data.length === 0) {
          showNotesMessage('내 메모가 아직 없습니다. 위에서 가상 메모를 추가해 주세요.');
          return;
        }
        list.replaceChildren(...data.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.body;
          const actions = document.createElement('div');
          actions.className = 'note-actions';
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = '수정';
          edit.addEventListener('click', () => void noteOperation(async (token, signal) => {
            const result = await noteRequest(`/api/notes/${encodeURIComponent(note.id)}`, 'GET', token, undefined, signal);
            if (!result || typeof result.id !== 'string' || typeof result.title !== 'string'
                || typeof result.body !== 'string') throw new Error('자료 형식이 맞지 않습니다.');
            return { editing: true, note: result };
          }));
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'secondary';
          remove.textContent = '삭제';
          remove.addEventListener('click', () => {
            if (!ready || !activeToken || noteBusy) return;
            if (!window.confirm('이 가상 메모를 삭제할까요?')) return;
            void noteOperation(async (token, signal) => {
              await noteRequest(`/api/notes/${encodeURIComponent(note.id)}`, 'DELETE', token, undefined, signal);
              return { message: '메모를 삭제했습니다.' };
            });
          });
          actions.append(edit, remove);
          item.append(title, content, actions);
          return item;
        }));
      } catch (error) {
        if (requestId !== notesRequest || controller.signal.aborted) return;
        showNotesMessage(error instanceof TypeError
          ? '자료 서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.' : error.message);
      }
    }

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.dataset.error = String(isError);
    }

    function setBusy(value) {
      busy = value;
      form.setAttribute('aria-busy', String(value));
      for (const control of [email, password, loginButton, logoutButton]) {
        control.disabled = !ready || value;
      }
      loginButton.textContent = value ? '처리 중…' : '로그인';
    }

    function renderSession(session) {
      const loggedIn = Boolean(session?.user);
      form.hidden = loggedIn;
      signedIn.hidden = !loggedIn;
      status.textContent = loggedIn ? '로그인됨' : '로그인하지 않은 상태입니다.';
      signedInEmail.textContent = session?.user?.email ?? '';
      password.value = '';
      const token = loggedIn && typeof session.access_token === 'string' ? session.access_token : null;
      editor.hidden = !token;
      if (token === activeToken) return;
      activeToken = token;
      const requestId = ++notesRequest;
      notesAbort?.abort();
      operationAbort?.abort();
      resetEditor();
      setNoteBusy(false);
      noteMessage.textContent = '';
      if (token) void loadNotes(token, requestId);
      else showNotesMessage('로그인하면 가상 자료를 볼 수 있습니다.');
    }

    function failureReason(error) {
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
        email_not_confirmed: '이메일 인증이 필요합니다. 받은 편지함의 인증 메일을 확인해 주세요.',
        user_banned: '이 계정은 현재 로그인이 제한되어 있습니다.',
        email_provider_disabled: '프로젝트의 이메일 로그인이 비활성화되어 있습니다.',
        signup_disabled: '프로젝트에서 계정 가입이 비활성화되어 있습니다.',
        over_request_rate_limit: '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.',
        over_email_send_rate_limit: '이메일 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.',
        validation_failed: '입력한 이메일과 비밀번호를 확인해 주세요.',
      };
      if (reasons[error?.code]) return reasons[error.code];
      if (error?.status === 429) return reasons.over_request_rate_limit;
      if (error?.name === 'AuthRetryableFetchError' || error instanceof TypeError) {
        return '로그인 서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.';
      }
      return '인증 요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!ready || busy) return;
      setBusy(true);
      showMessage('로그인 중입니다.');
      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: email.value.trim(), password: password.value,
        });
        if (error) throw error;
        if (!data.session) throw new Error('missing_session');
        renderSession(data.session);
        showMessage('로그인했습니다.');
      } catch (error) {
        showMessage(failureReason(error), true);
      } finally {
        password.value = '';
        setBusy(false);
      }
    });

    logoutButton.addEventListener('click', async () => {
      if (!ready || busy) return;
      setBusy(true);
      showMessage('로그아웃 중입니다.');
      try {
        const { error } = await client.auth.signOut({ scope: 'local' });
        if (error) throw error;
        renderSession(null);
        showMessage('로그아웃했습니다.');
      } catch (error) {
        showMessage(`로그아웃하지 못했습니다. ${failureReason(error)}`, true);
      } finally {
        setBusy(false);
      }
    });

    try {
      // Public project settings only. Authentication and session handling use the official SDK.
      client = window.supabase.createClient(
        'https://tdltpkfewovnxnxhvbkd.supabase.co',
        'sb_publishable_aY0sI27ZPYLgVeziuEPS6w_PeFRq4QH',
      );
      client.auth.onAuthStateChange((event, session) => {
        renderSession(session);
        if (event === 'SIGNED_OUT') showMessage('로그아웃했습니다.');
      });
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      renderSession(data.session);
      ready = true;
      setBusy(false);
    } catch {
      status.textContent = '로그인 기능을 준비하지 못했습니다.';
      showMessage('로그인 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.', true);
    }
  </script>
</body>
</html>
